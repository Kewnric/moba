name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

      # GitHub Pages serves index.html straight from main, so it must match the source in src/.
      - name: Check index.html matches the build
        run: |
          if ! git diff --quiet -- index.html; then
            echo "::error file=index.html::index.html is out of date. Run npm run build and commit the result."
            exit 1
          fi
